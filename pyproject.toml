[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ontomem"
version = "1.0.0"
description = "Ontology-guided knowledge representation and reasoning for explainable, consistent preference memory in AI agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Chetan M Patil" }, { name = "Harshit Raj" },
  { name = "Manish H Parashar" }, { name = "Bhavin Bhat" },
]
license = { text = "MIT" }
dependencies = [
  "rdflib>=7.0",
  "pyshacl>=0.26",
  "pyoxigraph>=0.4",
  "clingo>=5.6",
  "rapidfuzz>=3.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.4", "mypy>=1.10", "mcp>=1.2"]
mcp = ["mcp>=1.2"]

[project.scripts]
ontomem = "ontomem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ontomem = ["data/*.json", "data/ontology/*.ttl", "core/asp/*.lp", "data/prefrev/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running tests (benchmark smoke runs)"]
filterwarnings = ["ignore:ONTOMEM_SECRET not set:UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905", "B007", "UP042", "B019"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
